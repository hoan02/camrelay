services:
  camrelay:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      CAMRELAY_WEB_ROOT: ${CAMRELAY_WEB_ROOT:-/opt/camrelay/apps/web/dist}
    volumes:
      - ./data:/data
      - ./rclone:/data/.config/rclone:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/api/v1/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
